name: Daily tender scan

on:
  schedule:
    # Run after daily source discovery; also support an explicit post-discovery scan.
    - cron: "7 * * * *"
      timezone: "Africa/Kigali"
  workflow_dispatch:
  # Tagged releases scan newly discovered sources using cached OCR and match both active companies.
  # Ordinary code pushes do not start extra production scans.
  push:
    branches:
      - main
    paths:
      - .github/workflows/daily-tender-scan.yml

concurrency:
  group: opportunity-radar-data-pipeline
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_FALLBACK_ENABLED: ${{ vars.OPENAI_FALLBACK_ENABLED || 'true' }}
      OPENAI_FALLBACK_MODEL: 'gpt-6-luna'
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_FALLBACK_ENABLED: ${{ vars.GROQ_FALLBACK_ENABLED || 'true' }}
      GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL || 'openai/gpt-oss-120b' }}
      GROQ_FALLBACK_RPM: ${{ vars.GROQ_FALLBACK_RPM || '25' }}
      GROQ_FALLBACK_TPM: ${{ vars.GROQ_FALLBACK_TPM || '7000' }}
      GROQ_FALLBACK_RPD: ${{ vars.GROQ_FALLBACK_RPD || '900' }}
      GROQ_FALLBACK_TPD: ${{ vars.GROQ_FALLBACK_TPD || '180000' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_FALLBACK_ENABLED: ${{ vars.NVIDIA_FALLBACK_ENABLED || 'true' }}
      NVIDIA_FALLBACK_MODEL: ${{ vars.NVIDIA_FALLBACK_MODEL || 'meta/muse-glimmer-30b' }}
      NVIDIA_FALLBACK_RPM: ${{ vars.NVIDIA_FALLBACK_RPM || '32' }}
      NVIDIA_FALLBACK_TPM: ${{ vars.NVIDIA_FALLBACK_TPM || '40000' }}
      NVIDIA_FALLBACK_RPD: ${{ vars.NVIDIA_FALLBACK_RPD || '3000' }}
      NVIDIA_FALLBACK_TPD: ${{ vars.NVIDIA_FALLBACK_TPD || '3000000' }}
      COMMUNITY_API_ALLOW_COMPANY_DATA: ${{ vars.COMMUNITY_API_ALLOW_COMPANY_DATA || 'false' }}
      AUTOMATION_MODE: "scan"
      ENABLE_INTERNAL_SCHEDULER: "false"
      DAILY_SOURCE_SCAN: 'false'
      HOURLY_SCAN_MODE: 'true'
      WEBSITE_SCAN_BATCH_SIZE: '16'
      AI_SHARED_PROVIDER_BUDGETS: 'true'
      SCAN_FAIL_ON_ERRORS: 'true'
      WEBSITE_SCAN_WORKERS: '6'
      WEBSITE_MAX_PAGES_PER_SOURCE: '12'
      WEBSITE_CRAWL_BUDGET_SECONDS: '55'
      ENABLE_PDF_OCR: 'true'
      PDF_OCR_CACHE_PATH: '.cache/pdf_ocr_cache.json'
      FORCE_WEBSITE_DISCOVERY: 'false'

    steps:
      - name: Check out AI-enabled application
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install image-only PDF OCR engine when available
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null 2>&1; then
            timeout 90s bash -c 'export DEBIAN_FRONTEND=noninteractive; sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr' || echo "OCR engine unavailable; scanning still continues"
          fi
          if command -v tesseract >/dev/null 2>&1; then tesseract --version | head -n 1; fi

      - name: Restore reusable scanned-tender OCR text
        uses: actions/cache@v4
        with:
          path: .cache/pdf_ocr_cache.json
          key: pdf-ocr-${{ github.run_id }}
          restore-keys: |
            pdf-ocr-

      - name: Verify AI matching credentials
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::DATABASE_URL and GEMINI_API_KEY must be configured as repository Actions secrets."
            exit 1
          fi

      - name: Scan and qualify newly discovered opportunities with AI
        id: ingestion
        run: python -m app.automation_run

      - name: Match existing verified notices to new business profiles
        if: ${{ success() || steps.ingestion.outcome == 'failure' }}
        run: python -m app.backfill_matches
