name: Daily tender scan

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Africa/Kigali"
  workflow_dispatch:

concurrency:
  group: opportunity-radar-tender-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AUTOMATION_MODE: "scan"
      ENABLE_INTERNAL_SCHEDULER: "false"

    steps:
      - name: Check out AI-enabled application
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify AI matching credentials
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::DATABASE_URL and GEMINI_API_KEY must be configured as repository Actions secrets."
            exit 1
          fi

      - name: Scan and qualify opportunities with AI
        run: python -m app.automation_run
