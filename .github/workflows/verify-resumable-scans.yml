name: Verify resumable scanner changes
on:
  push:
    branches:
      - feature/resumable-site-scanning-20261115
  pull_request:
    branches:
      - global-saas-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run broad suite (exclude three known-failing baseline test files)
        run: |
          python -m pytest -q \
            --ignore=tests/unit/intelligence/test_applicant_entailment.py \
            --ignore=tests/unit/intelligence/test_evidence_policy.py \
            --ignore=tests/unit/intelligence/test_phase9m_policy.py
      - name: Verify resumable scanning and legacy behavior
        run: |
          python -m pytest -q \
            tests/integration/test_resumable_website_scan.py \
            tests/integration/test_scanner_orchestration.py \
            tests/unit/test_parallel_website_scan.py \
            tests/unit/test_daily_source_scan.py \
            tests/unit/test_job_in_rwanda_scanner.py \
            tests/unit/test_company_website_scanner.py
