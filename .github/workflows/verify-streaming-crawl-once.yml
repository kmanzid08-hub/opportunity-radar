name: Verify incremental publisher opportunity matching
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-streaming-crawl-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Compile app
        run: python -m compileall -q app
      - name: Test streaming, bounded crawls and company matching
        run: |
          python -m pytest -q \
            tests/unit/test_parallel_website_scan.py \
            tests/unit/test_daily_source_scan.py \
            tests/integration/test_scanner_orchestration.py \
            tests/unit/test_publisher_discovery_and_pdf.py \
            tests/unit/intelligence/test_source_discovery_integration.py \
            tests/unit/test_source_discovery_metrics.py \
            tests/unit/test_scheduled_discovery.py
      - name: Compile web templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment,FileSystemLoader
          root=Path("app/templates")
          env=Environment(loader=FileSystemLoader(str(root)))
          for p in root.rglob("*.html"):
              env.get_template(p.relative_to(root).as_posix())
          print("ALL_TEMPLATES_VALID")
          PY
