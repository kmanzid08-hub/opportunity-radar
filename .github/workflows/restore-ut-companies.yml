name: Restore UT CPA and UT Consulting test companies
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-ut-companies.yml

permissions:
  contents: read

concurrency:
  group: opportunity-radar-data-pipeline
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENABLE_INTERNAL_SCHEDULER: 'false'
      MATCH_BACKFILL_LIMIT: '10'
    steps:
      - name: Check out live application code
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate production secrets
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Database URL and Gemini API credentials must be configured"
            exit 1
          fi
      - name: Restore both separate admin-owned company profiles
        run: python -m app.restore_test_companies
      - name: Evaluate saved verified notices for the restored companies
        run: python -m app.backfill_matches
