name: Final discovery and OCR unit safety check
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-final-discovery-code.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify new-site priority and scanned-PDF fallback
        run: |
          python -m compileall -q app
          python -m pytest -q tests/unit/test_daily_source_scan.py tests/unit/test_publisher_discovery_and_pdf.py tests/unit/intelligence/test_source_discovery_integration.py
