name: Verify login CSRF cookie fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-csrf-fix.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out corrected application
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile CSRF middleware
        run: python -m py_compile app/beta_security.py
      - name: Verify session rotation, cookie stability and CSRF origin protection
        run: python -m pytest -q tests/test_csrf_cookie_stability.py
