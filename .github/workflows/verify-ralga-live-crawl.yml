name: Verify official publisher scan (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-ralga-live-crawl.yml]
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      ENABLE_PDF_OCR: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and OCR engine
        run: |
          pip install -r requirements.txt
          if ! command -v tesseract >/dev/null 2>&1; then
            timeout 90s bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr' || true
          fi
      - name: Crawl RALGA announcements with standard scanner, no DB writes
        run: |
          python - <<'PY'
          from app.scanners.company_websites import CompanyWebsiteScanner
          from app.models import Source
          scanner=CompanyWebsiteScanner()
          scanner.MAX_PAGES_PER_SOURCE=15
          scanner.REQUEST_DELAY_SECONDS=0.05
          url="https://www.ralga.rw"
          source=Source(
              organisation_name="Rwanda Association of Local Government Authorities",
              domain="ralga.rw",
              base_url=url,
              monitor_url=url,
              source_type="NGO",
              discovered_from=url,
              is_active=True,
              is_approved=True,
          )
          notices=scanner._scan_source(source)
          print("CRAWL_TOTAL_LISTINGS",len(notices),flush=True)
          for item in notices:
              print("CRAWL_LISTING",repr(item.title[:105]),
                    "deadline",item.deadline,
                    "url",item.source_url[:220],flush=True)
          print("AUDIT_NOTICE_CRAWLED", any(
              "audit_services" in item.source_url.lower() for item in notices
          ))
          assert notices, "Expected official site crawl to yield at least one tender notice"
          PY
