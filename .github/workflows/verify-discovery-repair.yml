name: Verify publisher recovery, PDFs and accurate error reporting
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-discovery-repair.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ENABLE_INTERNAL_SCHEDULER: 'false'
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Test publisher discovery, document scanning and regressions
        run: |
          python -m pytest -q \
            tests/unit/test_publisher_discovery_and_pdf.py \
            tests/unit/intelligence/test_source_discovery_integration.py \
            tests/unit/test_source_discovery_metrics.py \
            tests/unit/test_scheduled_discovery.py \
            tests/unit/test_daily_source_scan.py \
            tests/integration/test_scanner_orchestration.py
      - name: Run broader crawler and discovery compatibility suite
        run: python -m pytest -q tests -k 'source_discovery or source_quality or pdf or scanner or publisher or scheduled_discovery'
      - name: Compile website templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path("app/templates")
          env = Environment(loader=FileSystemLoader(str(root)))
          for path in root.rglob("*.html"):
              env.get_template(path.relative_to(root).as_posix())
          print("ALL_WEB_TEMPLATES_VALID")
          PY
      - name: Validate broad organization search coverage without saving records
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import urlparse
          from app.discovery.categories import DISCOVERY_CATEGORIES
          terms = ("Local government and membership associations", "Professional associations and sector federations")
          selected = [
              q for cat in DISCOVERY_CATEGORIES if cat.name in terms
              for q in cat.queries_for("Rwanda")
          ]
          s = requests.Session()
          s.headers.update({"X-Subscription-Token":os.environ["BRAVE_API_KEY"]})
          for q in selected:
              r = s.get("https://api.search.brave.com/res/v1/web/search",
                        params={"q":q, "count":20}, timeout=30)
              print("SEARCH_HTTP", r.status_code, q, flush=True)
              if r.ok:
                  hits = r.json().get("web",{}).get("results",[])
                  ralga = [u.get("url","") for u in hits if "ralga.rw" in u.get("url","")]
                  print("SEARCH_RESULTS", len(hits), "RALGA_SITE_HITS", len(ralga), flush=True)
                  for u in ralga: print("RALGA_FOUND",u,flush=True)
          PY
