name: Diagnose why RALGA is missed (read-only)
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-ralga-discovery.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure diagnostic dependencies
        run: pip install -r requirements.txt
      - name: Run RALGA discoverability diagnostic (no database writes, no AI)
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import requests
          from app.source_quality import SourceQualityEvaluator
          from app.source_discovery import SourceDiscovery, SearchResult
          from app.discovery.categories import DISCOVERY_CATEGORIES

          api_key = os.environ.get("BRAVE_API_KEY")
          if not api_key:
              raise SystemExit("No Brave API key")
          queries = (
              "Rwanda government tenders",
              "Rwanda NGO procurement",
              '"Rwanda" NGO "request for proposal"',
              '"Rwanda" external audit accounting tender consulting',
              '"Rwanda" "terms of reference" consultant',
              '"RALGA" Rwanda tenders audit',
              'site:ralga.rw tender audit',
          )
          url = "https://api.search.brave.com/res/v1/web/search"
          session = requests.Session()
          session.headers.update({"Accept":"application/json","X-Subscription-Token":api_key})
          print("PROBE_START",flush=True)
          for q in queries:
              try:
                  res = session.get(url,params={"q":q,"count":20,"search_lang":"en","safesearch":"moderate"},timeout=30)
                  if not res.ok:
                      print("QUERY_FAILED",q,"http",res.status_code,flush=True)
                      continue
                  results = res.json().get("web",{}).get("results",[])
                  hits = []
                  pdf_count = 0
                  for i,item in enumerate(results,1):
                      target = item.get("url","")
                      if urlparse(target).path.lower().endswith(".pdf"):
                          pdf_count += 1
                      if "ralga" in target.lower() or "rwanda association of local government" in (item.get("title","")+" "+item.get("description","")).lower():
                          hits.append((i,target,item.get("title","")[:90]))
                  print("SEARCH",repr(q),"results",len(results),"direct_pdfs",pdf_count,"ralga_hits",len(hits),flush=True)
                  for h in hits:
                      print("RALGA_HIT",h,flush=True)
              except Exception as exc:
                  print("SEARCH_EXCEPTION",repr(q),type(exc).__name__,str(exc)[:100],flush=True)
          check_urls = (
              "https://www.ralga.rw/",
              "https://www.ralga.rw/media/announcements",
              "https://www.ralga.rw/fileadmin/user_upload/RALGA/Announcements/Tender_Notice-Audit_Services.pdf",
          )
          assessor=SourceQualityEvaluator()
          category=next(c for c in DISCOVERY_CATEGORIES if c.name=="Audit and financial advisory buyers")
          for check in check_urls:
              p=urlparse(check).path
              title = "RALGA Audit Services Tender Notice" if p.lower().endswith(".pdf") else ("RALGA announcements" if "announcements" in p else "RALGA - Rwanda Association of Local Government Authorities")
              desc="RALGA Rwanda tender for external audit consultancy services"
              assessment=assessor.assess(title=title,description=desc,url=check,discovery_query='"Rwanda" external audit accounting tender consulting',country="Rwanda")
              print("SCORE",check,"score",assessment.discovery_score,"accepted_by_heuristic",assessment.accepted,"monitor_url",assessment.monitor_url,"pdf_monitored",assessment.monitor_url.lower().endswith(".pdf"),flush=True)
              try:
                  response=requests.get(check,timeout=16,headers={"User-Agent":"OpportunityRadar/1.0 source-analysis"},allow_redirects=True,stream=True)
                  print("HTTP",check,response.status_code,response.headers.get("Content-Type","")[:70],"final",response.url,flush=True)
                  response.close()
              except Exception as exc:
                  print("HTTP_EXCEPTION",check,type(exc).__name__,str(exc)[:160],flush=True)
          print("PROBE_END",flush=True)
          PY
