name: Verify free-provider fallback and token budgets
on:
  push:
    branches: [feature/groq-nvidia-rate-limited-fallback-20261118, global-saas-development]
  pull_request:
    branches: [global-saas-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify AI providers without external API calls
        run: |
          python -m compileall -q app tests
          python -m pytest -q \
            tests/test_free_api_fallback.py \
            tests/test_openai_fallback.py \
            tests/unit/intelligence/test_gemini_client.py \
            tests/unit/intelligence/test_gemini_retries.py \
            tests/unit/intelligence/test_gemini_diagnostics.py
      - name: Baseline-clean regression suite
        run: |
          python -m pytest -q \
            --ignore=tests/unit/intelligence/test_applicant_entailment.py \
            --ignore=tests/unit/intelligence/test_evidence_policy.py \
            --ignore=tests/unit/intelligence/test_phase9m_policy.py
