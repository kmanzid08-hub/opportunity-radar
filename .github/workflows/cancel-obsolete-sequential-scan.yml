name: Cancel obsolete sequential scan (one-time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cancel-obsolete-sequential-scan.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Release source-scanning pipeline for bounded parallel run
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/scan-cancel-reply -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/43629505025/cancel")
          echo "Previous sequential scan cancellation HTTP: $code"
          if [ "$code" != 202 ] && [ "$code" != 409 ]; then
            head -c 300 /tmp/scan-cancel-reply
            exit 1
          fi
