name: Verify dashboard template compilation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-dashboard-template.yml

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corrected application
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required tools
        run: pip install jinja2
      - name: Check all Jinja templates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path("app/templates")
          loader = Environment(loader=FileSystemLoader(str(root)))
          paths = sorted(path.relative_to(root).as_posix() for path in root.rglob("*.html"))
          for path in paths:
              loader.get_template(path)
              print("VALID:", path)
          assert paths, "No templates found"
          assert "{% endif %>" not in (root / "index.html").read_text()
          print(f"ALL_TEMPLATES_VALID: {len(paths)} templates compiled")
          PY
