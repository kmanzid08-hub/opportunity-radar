name: Verify dashboard template compilation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-dashboard-template.yml

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corrected application
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required tools
        run: pip install jinja2 pytest
      - name: Check all Jinja templates
        run: python -m pytest -q tests/test_template_syntax.py
