name: Verify Rwanda source discovery and daily crawling
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-discovery-scale.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_INTERNAL_SCHEDULER: 'false'
    steps:
      - name: Check out updated discovery and scanner
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application
        run: pip install -r requirements.txt
      - name: Compile changed application
        run: python -m compileall -q app
      - name: Test discovered source persistence, deduplication and scheduling
        run: |
          python -m pytest -q \
            tests/unit/intelligence/test_source_discovery_integration.py \
            tests/unit/test_source_discovery_metrics.py \
            tests/unit/test_scheduled_discovery.py \
            tests/unit/test_daily_source_scan.py \
            tests/integration/test_scanner_orchestration.py
      - name: Run complete application regression suite
        run: python -m pytest -q tests
      - name: Check all website templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root=Path("app/templates")
          env=Environment(loader=FileSystemLoader(str(root)))
          for p in root.rglob("*.html"):
              env.get_template(p.relative_to(root).as_posix())
          print("TEMPLATES_VALID")
          PY
