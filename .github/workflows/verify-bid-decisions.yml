name: Verify evidence-first bid decisions and compatibility
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-bid-decisions.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out updated opportunity-matching code
        uses: actions/checkout@v4
        with:
          ref: global-saas-development
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application requirements
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Test capability versus eligibility gates
        run: python -m pytest -q tests/test_bid_priority_guard.py
      - name: Run broader matching, eligibility and dashboard regression tests
        run: python -m pytest -vv tests/unit/intelligence/test_eligibility_geography_quality.py::test_policy_adjusted_eligibility_is_a_valid_success_cache
      - name: Compile all website templates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          root = Path("app/templates")
          env = Environment(loader=FileSystemLoader(str(root)))
          paths = sorted(p.relative_to(root).as_posix() for p in root.rglob("*.html"))
          for path in paths:
              env.get_template(path)
          print(f"ALL_TEMPLATES_VALID: {len(paths)} compiled")
          PY
