name: Website discovery

on:
  # Run website discovery every five days. The Python job also uses the
  # shared database to prevent an early duplicate execution.
  schedule:
    - cron: "20 4 */5 * *"
      timezone: "Africa/Kigali"
  workflow_dispatch:

concurrency:
  group: opportunity-radar-website-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      ENABLE_INTERNAL_SCHEDULER: "false"
      FORCE_WEBSITE_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover new websites when due
        run: python -m app.scheduled_discovery
