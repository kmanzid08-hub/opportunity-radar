# Alembic configuration for Opportunity Radar

[alembic]

# Path to migration scripts
script_location = migrations

# Add the project root to sys.path
prepend_sys_path = .

# Path separator used by Alembic
path_separator = os

# Database URL
#
# migrations/env.py may override this value using the application's
# DATABASE_URL configuration.
#
# This SQLite value provides a safe local default.
sqlalchemy.url = sqlite:///./opportunities.db


# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


# Root logger
[logger_root]
level = WARN
handlers = console
qualname =


# SQLAlchemy logger
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


# Alembic logger
[logger_alembic]
level = INFO
handlers =
qualname = alembic


# Console output
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# Log format
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S