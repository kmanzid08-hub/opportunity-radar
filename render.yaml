databases:
  - name: opportunity-radar-db
    databaseName: opportunity_radar
    user: opportunity_radar
    plan: free

services:
  - type: web
    name: opportunity-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-radar-db
          property: connectionString
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false"
      - key: BRAVE_API_KEY
        sync: false
