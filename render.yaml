databases:
  - name: opportunity-radar-db
    databaseName: opportunity_radar
    user: opportunity_radar
    plan: free

services:
  - type: web
    name: opportunity-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-radar-db
          property: connectionString
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "false"
      - key: BRAVE_API_KEY
        sync: false

  - type: cron
    name: opportunity-radar-daily-scan
    runtime: python
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scanner
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-radar-db
          property: connectionString

  - type: cron
    name: opportunity-radar-source-discovery
    runtime: python
    # Invoked daily; app.scheduled_discovery runs the real discovery only
    # when five full days have elapsed since the last successful run.
    schedule: "15 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scheduled_discovery
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: opportunity-radar-db
          property: connectionString
      - key: BRAVE_API_KEY
        sync: false
